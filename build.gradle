plugins {
    id 'maven-publish'
    id 'groovy'
    id 'org.jenkins-ci.jpi2' version '0.58.0-rc.5' 
    id 'jacoco'
    id "com.diffplug.spotless" version "6.20.0"
    id 'codenarc'
}

repositories {
    mavenCentral()
    maven { url('https://repo.jenkins-ci.org/public/') } 
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // This exposes the primary artifacts generated by the project
            from components.java 
            
            groupId = 'org.jenkins-ci.plugins'
            artifactId = 'templating-engine'
            version = '2.5.6'
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

group = 'org.jenkins-ci.plugins'
version = '2.5.6'
description = 'Allows users to create tool-agnostic, templated pipelines to be shared by multiple teams'

jenkinsPlugin {
    jenkinsVersion.set('2.580')
    pluginId.set('templating-engine')
    displayName.set('Templating Engine') 
    homePage.set(uri('https://github.com'))
}

// REQUIRED FOR JAVA 17/21+: Grants reflection access to the Jenkins serialization system
tasks.withType(Test).configureEach {
    jvmArgs([
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens=java.base/java.text=ALL-UNNAMED',
        '--add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED'
    ])
}

dependencies {
    // Fixed Jenkins BOM alignment
    implementation platform('io.jenkins.tools.bom:bom-2.568.x:6916.v15ec97679743')

    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'
    
    implementation 'org.jenkins-ci.plugins.workflow:workflow-multibranch'
    implementation 'org.jenkins-ci.plugins.workflow:workflow-api'
    implementation 'org.jenkins-ci.plugins:branch-api'
    implementation 'org.jenkins-ci.plugins:scm-api'
    implementation 'org.jenkins-ci.plugins:junit'
    implementation 'org.jenkins-ci.plugins:script-security'
    implementation 'org.jenkinsci.plugins:pipeline-model-definition'
    implementation 'org.jgrapht:jgrapht-core:1.4.0'
    implementation 'org.jenkins-ci.modules:sshd'
    implementation 'org.jenkins-ci.plugins:git'
    testImplementation(group: 'org.jenkins-ci.plugins.workflow', name: 'workflow-support', classifier: 'tests')


    // Stable testing dependencies for the Spock 1.3 / Groovy 2.4 runtime
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.spockframework:spock-core:1.3-groovy-2.4'
    testImplementation 'net.bytebuddy:byte-buddy:1.14.12' 
    testImplementation 'org.objenesis:objenesis:3.3'     

    testImplementation(group: 'org.jenkins-ci.plugins', name: 'scm-api', classifier: 'tests')
    
    testImplementation(group: 'org.jenkins-ci.plugins', name: 'git', classifier: 'tests') {
        exclude(module: 'httpclient')
        exclude(module: 'annotation-indexer')
    }

    testImplementation 'org.jenkins-ci.main:jenkins-test-harness'
}

// Workaround: Skip the scanner if it continues to reject Java 25 environments
tasks.named('checkAccessModifier').configure {
    enabled = false
}


jacocoTestReport {
    reports {
        html.required.set(true)
    }
}

spotless {
    groovy {
        target = fileTree("src/main/groovy") + fileTree(dir: "src/main/resources", include: "**/*.groovy") + fileTree("src/test/groovy")
        trimTrailingWhitespace()
        indentWithSpaces()
        endWithNewline()
    }
}

codenarc {
    toolVersion = '1.6.1'
    configFile = file('./config/codenarc/rules.groovy')
    ignoreFailures = true
}

codenarcMain {
    source = fileTree("src/main/groovy") + fileTree(dir: "src/main/resources", include: "**/*.groovy")
}

codenarcTest {
    configFile = file('./config/codenarc/rulesTest.groovy')
}

task runAllCodenarc {
    description = "Evaluate code against CodeNarc"
    dependsOn = [ 'codenarcMain', 'codenarcTest' ]
}

sourceSets {
    main {
        java {
            srcDirs = []
        }
        groovy {
            srcDirs = ["src/main/groovy", "src/main/java"]
            exclude "**/package-info.groovy"
        }
    }
}

tasks.register('printJTEVersion') {
    doLast {
        println version
    }
}
